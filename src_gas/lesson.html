<body>
    <div class="app-container">
        <!-- Lesson Header -->
        <div class="lesson-header">
            <button class="lesson-close" onclick="exitLesson()" title="Salir">✕</button>
            <div class="lesson-progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="lesson-progress" style="width: 0%;"></div>
                </div>
            </div>
            <div class="lesson-hearts">
                <span id="heart-icon">❤️</span>
                <span id="lesson-hearts">20</span>
            </div>
        </div>

        <!-- Lesson Content Area -->
        <div class="lesson-content" id="lesson-content">
            <div style="text-align:center; padding:3rem;">
                <div style="font-size:3rem; animation: float 2s infinite ease-in-out;">🦉</div>
                <p style="margin-top:1rem; color:var(--brand-400); font-weight:700; font-size:0.9rem; letter-spacing:0.15em; text-transform:uppercase;">
                    Cargando Misión...
                </p>
            </div>
        </div>

        <!-- Check Button -->
        <div class="action-bar" id="check-bar" style="display:none;">
            <button class="btn btn-primary btn-lg btn-block" id="check-btn" onclick="checkAnswer()">
                COMPROBAR
            </button>
        </div>

        <!-- Feedback Drawer -->
        <div id="feedback-drawer" class="feedback-drawer" style="display:none;"></div>
    </div>

    <script>
        // === LESSON DATA INYECTADA DESDE GAS ===
        const QUESTIONS = <?!= questions ?>;
        const PHASE_NUMBER = <?= phase_number ?>;
        const APP_URL = "<?= url ?>";
        
        let USER_ID = localStorage.getItem('user_id');
        let currentIndex = 0;
        let selectedOption = null;
        let startTime = Date.now();
        let isChecking = false;
        let currentHearts = 20;
        let hasPasted = false;
        let failedAttempts = 0;

        window.onload = function() {
            if (!USER_ID) {
                window.top.location.href = APP_URL + "?page=login";
                return;
            }
            renderQuestion();
        };

        function playTone(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playSound(type) {
            if (type === 'select') playTone(440, 0.08);
            else if (type === 'success') {
                playTone(523.25, 0.1);
                setTimeout(() => playTone(659.25, 0.15), 100);
            } else if (type === 'error') {
                playTone(220, 0.2);
            }
        }

        function renderQuestion() {
            if (currentIndex >= QUESTIONS.length) {
                completeModule();
                return;
            }

            const q = QUESTIONS[currentIndex];
            const progress = (currentIndex / QUESTIONS.length) * 100;
            document.getElementById('lesson-progress').style.width = progress + '%';

            hasPasted = false;
            failedAttempts = 0;
            selectedOption = null;
            isChecking = false;

            let html = `<div class="question-phase">${q.phase || 'Fase ' + PHASE_NUMBER}</div>`;
            
            // Renderizar imagen de infografía si existe (alojada en GitHub)
            if (q.image_filename) {
                const rawImageUrl = "https://raw.githubusercontent.com/ibertolottic-creator/Buhotech-versi-n-web-pusblica-/main/app/static/images/" + encodeURIComponent(q.image_filename);
                html += `
                    <div class="question-image" onclick="toggleImageExpand(this)" title="Toca para ampliar la infografía">
                        <img src="${rawImageUrl}" 
                             alt="${q.phase || 'Infografía Científica'}"
                             onerror="this.parentElement.style.display='none'">
                        <div style="font-size:0.75rem; color:var(--brand-300); margin-top:0.4rem; text-align:center;">🔍 Toca para ampliar infografía</div>
                    </div>`;
            }

            let qText = q.text;
            if (q.question_type === 'FILL_BLANK') {
                qText = q.text.replace('_____', '<span class="blank-dropzone" id="blank-zone">...</span>');
                html += `<div class="question-text">${qText}</div>`;
            } else {
                html += `<div class="question-text">${qText}</div>`;
            }

            if (q.question_type === 'MAIN' || q.question_type === 'RAPID' || q.question_type === 'DILEMMA' || q.question_type === 'SCENARIO' || q.question_type === 'FILL_BLANK' || q.question_type === 'HONESTY') {
                html += '<div class="options-container">';
                for (const opt of q.options) {
                    html += `
                        <button class="option-btn" data-id="${opt.id}" data-qtype="${q.question_type}">
                            <span class="option-marker">${opt.id}</span>
                            <span class="option-text">${opt.text}</span>
                        </button>`;
                }
                html += '</div>';
            } else if (q.question_type === 'TEXT') {
                html += `
                    <div style="margin-top: 1rem;">
                        <textarea id="text-answer" class="text-input" rows="4" maxlength="300" 
                            placeholder="Escribe tu respuesta aquí..." 
                            onpaste="handlePaste(event)" oninput="checkText()"></textarea>
                        <div style="text-align: right; font-size: 0.8rem; color: #888; margin-top:0.25rem;">
                            <span id="char-count">0</span>/300
                        </div>
                    </div>
                `;
            } else if (q.question_type === 'SORT') {
                html += `<div class="sort-container" id="sort-container">`;
                for (const opt of q.options) {
                    html += `
                        <div class="sort-item" data-id="${opt.id}" data-text="${opt.text}" onclick="selectSortItem(this)">
                            ${opt.text}
                        </div>`;
                }
                html += `</div>`;
                html += `<p style="font-size:0.8rem; color:#888; margin-top:15px;">Secuencia (toca los elementos para ordenarlos):</p>`;
                html += `<div id="sort-result" class="sort-result-box"></div>`;
                html += `<button class="btn btn-secondary btn-sm" onclick="resetSort()">Reiniciar Orden</button>`;
                selectedOption = [];
            } else if (q.question_type === 'MATCH') {
                const rightOptions = [...new Set(q.options.map(o => o.right))].sort(() => Math.random() - 0.5);
                html += `<div class="match-container">`;
                for (const opt of q.options) {
                    html += `
                        <div class="match-item" data-id="${opt.id}">
                            <div style="flex:1;">${opt.left}</div>
                            <div class="match-select-container">
                                <select class="match-select" onchange="selectMatchDropdown('${opt.id}', this.value)">
                                    <option value="" disabled selected>Selecciona...</option>`;
                    for (const rightOpt of rightOptions) {
                        html += `<option value="${rightOpt}">${rightOpt}</option>`;
                    }
                    html += `   </select>
                            </div>
                        </div>`;
                }
                html += `</div>`;
                selectedOption = {};
            }

            document.getElementById('lesson-content').innerHTML = html;
            document.getElementById('check-bar').style.display = 'none';
            document.getElementById('feedback-drawer').style.display = 'none';

            // Click listener para opciones
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const optId = this.dataset.id;
                    const qType = this.dataset.qtype;
                    const optText = this.querySelector('.option-text')?.textContent || '';
                    selectOption(this, optId, qType, optText);
                });
            });

            startTime = Date.now();
        }

        function toggleImageExpand(el) {
            el.classList.toggle('expanded');
        }

        function selectOption(btn, optId, qType, optText) {
            if (isChecking) return;
            playSound('select');
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedOption = optId;

            if (qType === 'FILL_BLANK') {
                const dropzone = document.getElementById('blank-zone');
                if(dropzone) {
                    dropzone.textContent = optText;
                }
            }
            document.getElementById('check-bar').style.display = 'flex';
        }

        function checkText() {
            if (isChecking) return;
            const ta = document.getElementById('text-answer');
            document.getElementById('char-count').innerText = ta.value.length;
            if (ta.value.trim().length > 5) {
                selectedOption = ta.value.trim();
                document.getElementById('check-bar').style.display = 'flex';
            } else {
                document.getElementById('check-bar').style.display = 'none';
            }
        }

        function handlePaste(e) {
            e.preventDefault();
            alert("⚠️ No puedes copiar y pegar. Tu integridad académica está siendo registrada.");
            hasPasted = true;
        }

        function selectSortItem(el) {
            if (el.classList.contains('selected') || isChecking) return;
            playSound('select');
            el.classList.add('selected');
            const id = el.dataset.id;
            const text = el.dataset.text;
            selectedOption.push(id);
            
            const resultBox = document.getElementById('sort-result');
            const div = document.createElement('div');
            div.className = "sort-item";
            div.innerText = selectedOption.length + ". " + text;
            resultBox.appendChild(div);

            if (selectedOption.length === QUESTIONS[currentIndex].options.length) {
                document.getElementById('check-bar').style.display = 'flex';
            }
        }

        function resetSort() {
            if (isChecking) return;
            document.querySelectorAll('#sort-container .sort-item').forEach(el => el.classList.remove('selected'));
            document.getElementById('sort-result').innerHTML = '';
            selectedOption = [];
            document.getElementById('check-bar').style.display = 'none';
        }

        function selectMatchDropdown(id, choice) {
            if (isChecking) return;
            playSound('select');
            selectedOption[id] = choice;
            if (Object.keys(selectedOption).length === QUESTIONS[currentIndex].options.length) {
                document.getElementById('check-bar').style.display = 'flex';
            }
        }

        function evaluateAnswerLocally(q, sel) {
            let isCorrect = false;
            let feedbackText = "";

            if (q.question_type === "HONESTY") {
                isCorrect = (sel === "A") ? hasPasted : !hasPasted;
                feedbackText = isCorrect ? "Gracias por tu honestidad. Asumir el error es el primer paso ético." : "La integridad académica es fundamental.";
            } else if (q.question_type === "SCENARIO" || q.question_type === "DILEMMA") {
                if (Array.isArray(q.options)) {
                    const opt = q.options.find(o => o.id === sel);
                    if (opt && opt.is_ethical !== undefined) {
                        isCorrect = opt.is_ethical;
                        feedbackText = opt.feedback || (isCorrect ? q.verification_text : q.rescue_text);
                    } else {
                        isCorrect = (sel === q.correct_answer);
                        feedbackText = isCorrect ? q.verification_text : q.rescue_text;
                    }
                } else {
                    isCorrect = (sel === q.correct_answer);
                    feedbackText = isCorrect ? q.verification_text : q.rescue_text;
                }
            } else if (q.question_type === "MATCH") {
                try {
                    let selections = (typeof sel === 'string') ? JSON.parse(sel) : sel;
                    isCorrect = true;
                    const options = Array.isArray(q.options) ? q.options : [];
                    for (let i = 0; i < options.length; i++) {
                        const opt = options[i];
                        const chosen = String(selections[opt.id] || '').trim();
                        const expected = String(opt.right || '').trim();
                        if (chosen !== expected) {
                            isCorrect = false;
                            break;
                        }
                    }
                } catch(e) { isCorrect = false; }
                feedbackText = isCorrect ? (q.verification_text || "¡Excelente! Has comprendido la alineación lógica.") : (q.rescue_text || "El problema es pregunta, el objetivo es verbo, la hipótesis es afirmación.");
            } else if (q.question_type === "SORT") {
                const expected = Array.isArray(q.correct_answer) ? q.correct_answer.join(',') : String(q.correct_answer);
                const actual = Array.isArray(sel) ? sel.join(',') : String(sel);
                isCorrect = (actual.trim() === expected.trim());
                feedbackText = isCorrect ? (q.verification_text || "¡Secuencia correcta!") : (q.rescue_text || "Revisa el orden secuencial.");
            } else {
                isCorrect = (String(sel).trim().toUpperCase() === String(q.correct_answer).trim().toUpperCase());
                feedbackText = isCorrect ? (q.verification_text || "¡Correcto!") : (q.rescue_text || "Revisa los conceptos clave.");
            }

            return { isCorrect, feedbackText };
        }

        function checkAnswer() {
            if (!selectedOption || isChecking) return;
            isChecking = true;

            const q = QUESTIONS[currentIndex];
            const responseTimeMs = Date.now() - startTime;

            let payloadAnswer = selectedOption;
            if (q.question_type === 'SORT') payloadAnswer = selectedOption.join(',');
            else if (q.question_type === 'MATCH') payloadAnswer = JSON.stringify(selectedOption);

            // 1. EVALUACIÓN INSTANTÁNEA LOCAL (0 ms - Cero espera de servidor o IA)
            const localEval = evaluateAnswerLocally(q, payloadAnswer);
            const isCorrect = localEval.isCorrect;
            const feedbackText = localEval.feedbackText;

            let behaviorFlag = "NORMAL";
            const minTime = q.min_reading_time_ms || 3000;
            const expTime = q.expected_time_ms || 10000;
            if (responseTimeMs < minTime) behaviorFlag = "FAST_RANDOM";
            else if (responseTimeMs > expTime) behaviorFlag = "SEARCHING_THINKING";
            if (hasPasted) behaviorFlag = "PASTED";

            if (!isCorrect) {
                failedAttempts++;
                if (failedAttempts === 1) {
                    currentHearts = Math.max(0, currentHearts - 1);
                    document.getElementById('lesson-hearts').textContent = currentHearts;
                }
            }

            // Marcar opciones en verde / rojo inmediatamente
            if (q.question_type === 'MAIN' || q.question_type === 'RAPID' || q.question_type === 'DILEMMA' || q.question_type === 'SCENARIO' || q.question_type === 'FILL_BLANK' || q.question_type === 'HONESTY') {
                document.querySelectorAll('.option-btn').forEach(btn => {
                    const id = btn.dataset.id;
                    btn.disabled = true;
                    if (id === q.correct_answer) {
                        btn.classList.add('correct');
                    } else if (id === selectedOption && !isCorrect) {
                        btn.classList.add('wrong');
                    } else {
                        btn.classList.add('dimmed');
                    }
                });
            }

            playSound(isCorrect ? 'success' : 'error');
            const xpGained = (isCorrect && behaviorFlag !== "FAST_RANDOM") ? ((failedAttempts === 0) ? 10 : 5) : 0;
            if (xpGained > 0) showXpPopup('+' + xpGained + ' XP');

            // Mostrar el drawer de retroalimentación de inmediato (cero milisegundos)
            showFeedback({
                is_correct: isCorrect,
                feedback_text: feedbackText,
                behavior: behaviorFlag
            });

            // 2. SINCRONIZACIÓN ASÍNCRONA EN SEGUNDO PLANO (No bloquea la pantalla)
            const payload = {
                userId: USER_ID,
                questionId: q.id,
                selectedAnswer: payloadAnswer,
                responseTimeMs: responseTimeMs,
                hasPasted: hasPasted,
                failedAttempts: failedAttempts,
                dimension: q.dimension,
                level: q.level
            };

            google.script.run
                .withSuccessHandler(function(data) {
                    isChecking = false;
                    if (data && data.user && data.user.hearts !== undefined) {
                        currentHearts = data.user.hearts;
                        document.getElementById('lesson-hearts').textContent = currentHearts;
                    }
                })
                .withFailureHandler(function(err) {
                    isChecking = false;
                })
                .rpcRespondQuiz(payload);
        }

        function showFeedback(data) {
            const drawer = document.getElementById('feedback-drawer');
            drawer.className = `feedback-drawer ${data.is_correct ? 'success' : 'error'}`;

            let behaviorHtml = '';
            if (data.behavior === 'FAST_RANDOM') {
                behaviorHtml = '<div class="behavior-badge">⚠️ Respondiste muy rápido. ¡Lee con calma!</div>';
            } else if (data.behavior === 'PASTED') {
                behaviorHtml = '<div class="behavior-badge">🚨 Copiar/Pegar detectado.</div>';
            } else if (data.behavior === 'SEARCHING_THINKING' && data.is_correct) {
                behaviorHtml = '<div class="behavior-badge">🧠 Pensaste bien tu respuesta</div>';
            }

            drawer.innerHTML = `
                <div class="feedback-header">
                    <div class="feedback-mascot">🦉</div>
                    <div>
                        <div class="feedback-title">${data.is_correct ? '¡Excelente Intuición!' : '🚨 Misión de Rescate'}</div>
                        ${behaviorHtml}
                        <div class="feedback-text">${data.feedback_text || ''}</div>
                    </div>
                </div>
                <button class="btn ${data.is_correct ? 'btn-success' : 'btn-danger'} btn-lg btn-block" onclick="nextQuestion('${data.is_correct}')">
                    CONTINUAR
                </button>
            `;
            drawer.style.display = 'block';
            document.getElementById('check-bar').style.display = 'none';
        }

        function nextQuestion(wasCorrect) {
            if (currentHearts <= 0) {
                alert('💔 ¡Te has quedado sin vidas! Repasa la teoría.');
                window.top.location.href = APP_URL + "?page=dashboard";
                return;
            }
            if (wasCorrect === 'true') {
                currentIndex++;
                renderQuestion();
            } else {
                renderQuestion();
            }
        }

        function completeModule() {
            google.script.run
                .withSuccessHandler(function(res) {
                    playSound('success');
                    document.getElementById('lesson-content').innerHTML = `
                        <div style="text-align:center; padding:3rem;">
                            <div style="font-size:5rem; margin-bottom:1rem; animation: float 2s ease-in-out infinite;">🏆</div>
                            <h2 style="font-family:var(--font-display); font-size:1.8rem; color:var(--gold-400); margin-bottom:0.5rem;">¡Fase Completada!</h2>
                            <p style="color:var(--slate-300); margin-bottom:1.5rem;">Completaste satisfactoriamente este módulo de entrenamiento.</p>
                            <button onclick="exitLesson()" class="btn btn-primary btn-lg btn-block">Volver al Dashboard</button>
                        </div>
                    `;
                    document.getElementById('check-bar').style.display = 'none';
                    document.getElementById('feedback-drawer').style.display = 'none';
                })
                .rpcCompleteModule(USER_ID, PHASE_NUMBER);
        }

        function showXpPopup(text) {
            const popup = document.createElement('div');
            popup.className = 'xp-popup';
            popup.textContent = text;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1200);
        }

        function safeRedirect(targetUrl) {
            try {
                let link = document.getElementById('safe-redirect-anchor');
                if (!link) {
                    link = document.createElement('a');
                    link.id = 'safe-redirect-anchor';
                    link.target = '_top';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                }
                link.href = targetUrl;
                link.click();
            } catch(e) {
                try {
                    window.top.location.href = targetUrl;
                } catch(e2) {
                    window.location.href = targetUrl;
                }
            }
        }

        function exitLesson() {
            safeRedirect(APP_URL + "?page=dashboard");
        }
    </script>
</body>
</html>
