<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - Buhotech Labs</title>
    <?!= include('styles'); ?>
</head>
<body>
    <div class="app-container">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:2rem;">

            <!-- Logo y Mascota -->
            <div style="text-align:center; margin-bottom:3rem;">
                <div style="font-size:4.5rem; margin-bottom:1rem; animation: float 3s ease-in-out infinite;">🦉</div>
                <h1 style="font-family:var(--font-display); font-size:2.2rem; font-weight:900; background:linear-gradient(135deg, var(--brand-400), var(--success-400)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:0.5rem;">
                    Buhotech Labs
                </h1>
                <p style="color:var(--slate-400); font-weight:600; font-size:0.85rem; letter-spacing:0.05em;">
                    La Agencia de Investigadores Científicos
                </p>
            </div>

            <!-- Formulario de Login -->
            <div class="glass-card" style="width:100%; max-width:360px;">
                <form id="loginForm" style="display:flex; flex-direction:column; gap:1rem;">
                    <label style="font-weight:700; font-size:0.85rem; color:var(--slate-300); text-transform:uppercase; letter-spacing:0.1em;">
                        Nombre de Usuario
                    </label>
                    <input
                        type="text"
                        id="username"
                        class="input-field"
                        placeholder="Ej: maria_perez"
                        required
                        autofocus
                        autocomplete="username"
                    >
                    <p id="errorMsg" style="color:var(--accent-400); font-size:0.85rem; font-weight:600; display:none;"></p>
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block" style="margin-top:0.5rem;">
                        🚀 Comenzar Misión
                    </button>
                </form>
            </div>

            <!-- Footer Info -->
            <p style="margin-top:2rem; color:var(--slate-600); font-size:0.75rem; text-align:center; max-width:300px; line-height:1.6;">
                Plataforma de Aprendizaje Adaptativo<br>
                Metodología de la Investigación - USMP 2026<br>
                <em>Powered by Google Apps Script</em>
            </p>
        </div>
    </div>

    <style>
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }
    </style>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('submitBtn');
            var errorMsg = document.getElementById('errorMsg');
            var username = document.getElementById('username').value.trim();
            
            if(!username) return;
            
            btn.disabled = true;
            btn.innerHTML = 'Cargando...';
            errorMsg.style.display = 'none';
            
            // Llamada RPC a GAS
            google.script.run
                .withSuccessHandler(function(res) {
                    if(res.success) {
                        // Guardar sesión en LocalStorage
                        localStorage.setItem('user_id', res.user.id);
                        localStorage.setItem('username', res.user.username);
                        // Redirigir al dashboard
                        window.top.location.href = "<?= url ?>?page=dashboard";
                    } else {
                        errorMsg.textContent = res.error;
                        errorMsg.style.display = 'block';
                        btn.disabled = false;
                        btn.innerHTML = '🚀 Comenzar Misión';
                    }
                })
                .withFailureHandler(function(err) {
                    errorMsg.textContent = "Error de conexión";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '🚀 Comenzar Misión';
                })
                .rpcLogin(username);
        });
        
        // Auto-login si ya existe la sesión
        window.onload = function() {
            var savedUser = localStorage.getItem('user_id');
            if (savedUser) {
                window.top.location.href = "<?= url ?>?page=dashboard";
            }
        };
    </script>
</body>
</html>
